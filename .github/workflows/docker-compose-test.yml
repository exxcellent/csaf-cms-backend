name: Docker Compose Smoke Test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "docker/**"
      - ".github/workflows/docker-compose-test.yml"

jobs:
  compose-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env from example
        working-directory: docker
        run: |
          cp .env.example .env
          # Fill in required secrets with dummy values for CI
          echo "CSAF_CLIENT_SECRET=ci-test-secret-value" >> .env
          echo "CSAF_COOKIE_SECRET=$(openssl rand -base64 32 | tr -d '\n')" >> .env

      - name: Start Docker Compose stack
        working-directory: docker
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Verify CouchDB is healthy
        run: |
          echo "Testing CouchDB..."
          curl --fail --silent --show-error http://localhost:5984/_up

      - name: Verify Keycloak via reverse proxy
        run: |
          echo "Testing Keycloak realm endpoint via nginx..."
          curl --fail --silent --show-error http://localhost/realms/csaf

      - name: Verify Secvisogram frontend via reverse proxy
        run: |
          echo "Testing Secvisogram frontend via nginx..."
          curl --fail --silent --show-error --output /dev/null --write-out "%{http_code}" http://localhost/ | grep -q "200"

      - name: Verify Validator service
        run: |
          echo "Testing Validator service..."
          curl --fail --silent --show-error http://localhost:8082/api/v1/tests

      - name: Show container status
        if: always()
        working-directory: docker
        run: docker compose ps -a

      - name: Dump container logs on failure
        if: failure()
        working-directory: docker
        run: docker compose logs --tail=100

      - name: Stop Docker Compose stack
        if: always()
        working-directory: docker
        run: docker compose down --volumes
